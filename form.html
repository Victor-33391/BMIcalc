<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calcolatore BMI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ececea;
      font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #1c2024;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .pagina {
      width: 100%;
      max-width: 480px;
      min-height: 640px;
      background: #f0f1f3;
      border: 1px solid #d0d0cc;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      font-weight: 700;
      margin: 0 0 24px;
    }

    form {
      background: #fff;
      border-radius: 14px;
      padding: 24px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      font: inherit;
      font-size: 1rem;
      border: 1px solid #c4c7cc;
      border-radius: 8px;
      background: #fff;
      margin-bottom: 16px;
    }

    input::placeholder { color: #8b8e94; }

    input:focus {
      outline: none;
      border-color: #1f2328;
      box-shadow: 0 0 0 3px rgba(31, 35, 40, 0.12);
    }

    button {
      width: 100%;
      height: 44px;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      background: #1f2328;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #343a41; }
  </style>
</head>
<body>
  <main class="pagina">
    <h1>Calcolatore BMI</h1>

    <!-- Il form invia i dati alla pagina PHP che esegue il calcolo -->
    <form action="calcola.php" method="post">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" placeholder="Luca" required>

      <label for="peso">Peso (kg)</label>
      <input type="number" id="peso" name="peso" placeholder="70" min="1" max="500" step="0.1" required>

      <label for="altezza">Altezza (cm)</label>
      <input type="number" id="altezza" name="altezza" placeholder="178" min="30" max="260" step="0.1" required>

      <button type="submit">Calcola</button>
    </form>
  </main>
</body>
</html>
